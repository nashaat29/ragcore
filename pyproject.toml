[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcore"
version = "0.1.0"
description = "Open-source RAG framework with FAISS + Ollama"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Mohammed Nashaat", email = "mohammednashaat29@gmail.com" },
]

dependencies = [
    "langchain-ollama>=1.0.0",
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "rank-bm25>=0.2.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pypdf>=6.11.0",
    "slowapi>=0.1.9",
    "limits>=3.0.0",
    "nemoguardrails>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
monitoring = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["ragcore*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
